<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ConsentGuard AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 200px;
      background: #0f0f1a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e35;
    }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-sub   { font-size: 11px; color: #64748b; }

    .state {
      padding: 32px 16px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
    }
    .state .icon { font-size: 28px; margin-bottom: 8px; }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid #1e1e35;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .score-section {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e35;
    }
    .score-ring {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 3px solid var(--ring-color, #6366f1);
      flex-shrink: 0;
    }
    .score-num   { font-size: 22px; font-weight: 800; color: var(--ring-color); }
    .score-denom { font-size: 10px; color: #475569; }
    .score-info  { flex: 1; }
    .score-level {
      font-size: 13px; font-weight: 700;
      color: var(--ring-color);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .score-summary { font-size: 12px; color: #94a3b8; line-height: 1.5; }

    .policy-link {
      font-size: 10px;
      color: #475569;
      padding: 6px 16px;
      border-bottom: 1px solid #1e1e35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .policy-link a { color: #6366f1; text-decoration: none; }

    .section { border-bottom: 1px solid #1e1e35; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
    }
    .section-header:hover { background: #111127; }
    .section-title {
      font-size: 12px; font-weight: 600;
      color: #cbd5e1;
      display: flex; align-items: center; gap: 6px;
    }
    .section-toggle { font-size: 10px; color: #475569; }
    .section-body   { padding: 0 16px 12px; display: none; }
    .section-body.open { display: block; }

    .flag-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #1a1a2e;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .flag-item:last-child { border-bottom: none; }
    .flag-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .cat-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin: 10px 0 4px;
    }
    .cat-label:first-child { margin-top: 0; }
    .cat-item {
      font-size: 12px;
      color: #94a3b8;
      padding: 2px 0 2px 10px;
      border-left: 2px solid #1e1e35;
      margin-bottom: 2px;
      line-height: 1.4;
    }

    .positive-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 0;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .positive-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .cached-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      background: #1e1e35;
      color: #475569;
      border-radius: 4px;
      margin: 6px 16px;
    }

    .empty { color: #475569; font-size: 12px; font-style: italic; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <div>
      <div class="header-title">ConsentGuard AI</div>
      <div class="header-sub" id="site-domain">Privacy Policy Analyzer</div>
    </div>
  </div>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
