

services:
  - type: web
    name: consentguard_Ai
    runtime: python
    plan: free                     
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false                
      - key: HUGGINGFACE_API_KEY
        sync: false                
      - key: APP_API_KEY
        sync: false                
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"

    
